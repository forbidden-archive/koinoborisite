<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY ウロコ | こい、のぼれ。</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="my-uroko-page">

  <header class="mu-header fade-in">
    <div class="mu-logo">こい、のぼれ。</div>
    <div class="mu-area">田名第三自治会</div>
  </header>

  <main class="mu-main">
    <div class="mu-visual fade-in">
      <div class="koi-wrapper">
        <div class="scale-pattern">
          <div class="scale"></div><div class="scale highlight heartbeat"></div><div class="scale"></div>
          <div class="scale family"></div><div class="scale"></div><div class="scale"></div>
        </div>
      </div>
      <p class="mu-location">おおよその場所：<br><strong>中央付近・胴体3段目あたり</strong></p>
    </div>

    <div class="mu-countdown fade-in">
      <p>相模川を泳ぐまで、あと</p>
      <div class="days" id="countdown-days">--<span>日</span></div>
    </div>

    <div class="mu-tabs fade-in">
      <div class="tab active">今年の家族</div>
      <div class="tab">これまでの記録</div>
    </div>
    <div class="mu-tab-content fade-in">
      <ul class="family-list">
        <li><span class="color-dot" style="background: #c44b2b;"></span> あなた（ハイライト）</li>
        <li><span class="color-dot" style="background: #7ca8b8;"></span> お父さん（胴体前部）</li>
        <li><span class="color-dot" style="background: #e2b464;"></span> お母さん（尾びれ付近）</li>
      </ul>
    </div>
  </main>

  <footer class="mu-footer fade-in">
    <p>5月5日、右の鱗を持って 相模川へ。</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
